[workspace]
resolver = "3"
members = [
  "crates/sim-ledger",
  "crates/sim-ledger-cli",
  "crates/sim-lib-ledger-books",
  "crates/sim-lib-ledger-close",
  "crates/sim-ledger-odb",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-ledger"
homepage = "https://github.com/sim-nest/sim-ledger"

[workspace.lints.rust]
unsafe_code = "forbid"
