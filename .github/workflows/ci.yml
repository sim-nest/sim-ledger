# GitHub Actions CI for this crate.
name: ci
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SIMDOC_TOOLING_MANIFEST: ${{ github.workspace }}/sim-tooling/Cargo.toml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: sim-nest/sim-tooling
          path: sim-tooling
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run -p xtask -- check-orphan-crates
      - name: simdoc --check (guest-only; see sim-tooling docs/simdoc-trust-boundaries.md)
        continue-on-error: true
        run: cargo run --locked --manifest-path sim-tooling/crates/simdoc/Cargo.toml -- simdoc --check
        # simdoc now lives in its own isolated resolver root (sim-tooling's
        # shared xtask dispatch deliberately refuses the old routed
        # invocation since the 2026-09-29 reconciliation -- see
        # sim-tooling's src/dispatch.rs). Invoked directly here instead,
        # against the sibling checkout already fetched above.
        #
        # Structurally cannot pass on hosted CI regardless of invocation
        # path: crates/simdoc's build.rs deliberately refuses to compile
        # unless the toolchain content digest matches its committed pin
        # exactly (that check IS the point of the engine-trust design, not
        # a bug -- see sim-tooling's B6/B12). GitHub's hosted runner never
        # has that exact toolchain. sim-tooling's own CI already treats
        # this route as guest-only for the same reason; this repo's docs
        # generation is verified on the guest, not here. Non-blocking so
        # it does not permanently redden a required check for a limitation
        # that has nothing to do with this repo's own code. Same fix
        # applied across the constellation the same night (sim-runtime,
        # sim-codecs, and others).
