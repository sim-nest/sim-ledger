[package]
name = "sim-ledger-cli"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Command line imports and reports for sim-ledger sets."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-ledger"
homepage = "https://github.com/sim-nest/sim-ledger"

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
sim-ledger = { version = "0.1.0", path = "../sim-ledger" }
sim-ledger-odb = { version = "0.1.0", path = "../sim-ledger-odb" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
