[package]
name = "sim-ledger"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Yearly ledger records and exact amount helpers."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-ledger"
homepage = "https://github.com/sim-nest/sim-ledger"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
