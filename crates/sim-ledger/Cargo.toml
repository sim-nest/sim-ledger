[package]
name = "sim-ledger"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Yearly ledger records and exact amount helpers."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-ledger"
homepage = "https://github.com/sim-nest/sim-ledger"

[features]
default = []
sim = ["dep:sim-codec"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sim-storage-port = { version = "0.2.0" }
sim-relation-core = { version = "0.2.0" }
sim-relation-migrate = { version = "0.2.0" }
sim-relation-plan = { version = "0.2.0" }
sim-relation-schema = { version = "0.2.0" }
sim-relation-site = { version = "0.2.0" }
sim-ledger-store-port = { path = "../sim-ledger-store-port" }
sim-codec = { version = "0.3.0", optional = true }
sim-kernel = { version = "0.4.0" }
toml = "0.8"

[dev-dependencies]
sim-ledger-test-support = { path = "../sim-ledger-test-support" }

[lints]
workspace = true
