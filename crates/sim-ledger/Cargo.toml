[package]
name = "sim-ledger"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Yearly ledger records and exact amount helpers."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-ledger"
homepage = "https://github.com/sim-nest/sim-ledger"

[features]
default = []
sim = ["dep:sim-codec", "dep:sim-kernel"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sim-storage-port = { version = "0.1.0" }
sim-codec = { version = "0.1.4", optional = true }
sim-kernel = { version = "0.2.0", optional = true }
toml = "0.8"

[dev-dependencies]
sim-ledger-test-support = { path = "../sim-ledger-test-support" }

[lints]
workspace = true
