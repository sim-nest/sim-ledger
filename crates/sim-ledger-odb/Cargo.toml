[package]
name = "sim-ledger-odb"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "LibreOffice Base ODB helpers for sim-ledger imports."
readme = "README.md"
publish = false
repository = "https://github.com/sim-nest/sim-ledger"
homepage = "https://github.com/sim-nest/sim-ledger"

[dependencies]
csv = "1"
sim-codec-sql = "0.2.0"
sim-ledger = { version = "0.1.0", path = "../sim-ledger" }
time = "0.3"
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true
